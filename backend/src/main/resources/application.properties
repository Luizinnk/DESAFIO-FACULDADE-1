spring.application.name=agendauni
server.port=8080

# Banco PostgreSQL (valores podem ser trocados por variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agendauni}
spring.datasource.username=${DB_USER:agendauni}
spring.datasource.password=${DB_PASSWORD:agendauni}

# As tabelas são criadas pelo schema.sql (fonte única da estrutura do banco)
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Sessão de login: expira em 8 horas sem uso
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true

# true = apaga e recria os dados fictícios ao iniciar (usado pelo "npm run reset")
app.reset-dados=${RESET_DADOS:false}

# As recusas do banco (cadastro em uso, nome repetido) já viram mensagens amigáveis na API
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
